<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<title>AT in mutande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
:root{
  --bg:#0f0a1a;--fg:#f5f0ff;--card:#2a1f3d;--card2:#3d2e55;--acc:#ffd23f;--acc2:#ff9f1c;
  --hp:#e63946;--xp:#4cc9f0;--shadow:0 4px 20px rgba(0,0,0,.5);
  box-sizing:border-box;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 14px 6px;display:flex;gap:10px;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;pointer-events:none;z-index:10;text-shadow:0 1px 3px #000}
#hud span{background:rgba(0,0,0,.45);padding:4px 10px;border-radius:20px;backdrop-filter:blur(4px)}
#bar-wrap{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 42px);height:10px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;z-index:10;box-shadow:inset 0 1px 3px #0008}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--xp),#90e0ef);border-radius:6px;transition:width .15s linear}
#hpbar-wrap{position:fixed;left:12px;width:120px;top:calc(env(safe-area-inset-top,0px) + 56px);height:8px;background:rgba(0,0,0,.5);border-radius:5px;overflow:hidden;z-index:10}
#hpfill{height:100%;width:100%;background:linear-gradient(90deg,#e63946,#ff6b6b);border-radius:5px;transition:width .1s}
#pb{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 56px);background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:12px;font-size:18px;padding:6px 12px;z-index:15;backdrop-filter:blur(6px);box-shadow:var(--shadow)}
#ov{position:fixed;inset:0;background:rgba(8,5,15,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center;z-index:20;backdrop-filter:blur(8px);overflow-y:auto}
#ov h1{font-size:2rem;color:var(--acc);text-shadow:0 0 20px #ffd23f66;margin-bottom:4px}
#ov h2{font-size:1.4rem;color:var(--acc);margin-bottom:6px}
#ov p{opacity:.9;line-height:1.4;max-width:340px}
.b{background:linear-gradient(180deg,var(--card2),var(--card));color:var(--fg);border:2px solid var(--acc);border-radius:14px;padding:14px 16px;width:min(340px,92%);font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;box-shadow:0 4px 14px rgba(0,0,0,.4);text-align:left}
.b:active{transform:scale(.97)}
.b:hover{border-color:#ffe066;box-shadow:0 0 18px #ffd23f44}
.b.primary{background:linear-gradient(180deg,#3d2e55,#2a1f3d);border-color:var(--acc2);text-align:center}
#joystick-hint{position:fixed;bottom:env(safe-area-inset-bottom,20px);left:0;right:0;text-align:center;font-size:13px;opacity:.5;pointer-events:none;z-index:5}
/* ===== Grafica v5: interfaccia ===== */
:root{--ink:#120a1e;--panel:rgba(20,12,34,.72);--display:"Lilita One","Trebuchet MS",system-ui,sans-serif}
html,body{background:#0b0712}
/* barra esperienza sottile, a tutta larghezza, in cima */
#bar-wrap{left:0;right:0;top:env(safe-area-inset-top,0px);height:6px;border-radius:0;background:rgba(10,5,20,.8);box-shadow:none}
#fill{border-radius:0 4px 4px 0;background:linear-gradient(90deg,#4cc9f0,#a5f3ff);box-shadow:0 0 10px #4cc9f0}
#hud{top:calc(env(safe-area-inset-top,0px) + 8px);padding:0 10px;font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:.02em;text-shadow:0 2px 0 var(--ink)}
#hud span{background:var(--panel);border:2px solid rgba(255,255,255,.08);box-shadow:0 3px 0 rgba(0,0,0,.45);padding:3px 11px;border-radius:12px}
#hp{color:#ffd0d4}#timer{color:#fff3c4}#kills{color:#e0d4ff}#lv{color:#a5f3ff}
#hpbar-wrap{left:10px;width:132px;top:calc(env(safe-area-inset-top,0px) + 42px);height:9px;border:2px solid var(--ink);background:#2a0a12;border-radius:6px;box-sizing:content-box}
#hpfill{background:linear-gradient(180deg,#ff8a8a,#e63946 60%,#b0172a);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
#curbar{top:calc(env(safe-area-inset-top,0px) + 40px)!important;font-family:var(--display);font-weight:400!important;font-size:14px!important;letter-spacing:.03em}
#cur{background:var(--panel)!important;border:2px solid rgba(255,255,255,.08);border-radius:12px!important;padding:2px 10px!important;text-shadow:0 2px 0 var(--ink)}
#pb{top:calc(env(safe-area-inset-top,0px) + 40px);right:10px;background:var(--panel);border:2px solid rgba(255,255,255,.12);border-radius:12px;padding:4px 12px;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.45)}
/* menu e schermate */
#ov{background:radial-gradient(ellipse at 50% 30%,rgba(60,25,90,.92),rgba(8,4,16,.96) 70%);gap:12px}
#ov h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,11vw,3.6rem);line-height:1;color:#ffd23f;letter-spacing:.02em;
  text-shadow:0 4px 0 #b3570a,0 7px 0 var(--ink),0 0 34px rgba(255,190,60,.45);transform:rotate(-3deg);margin-bottom:10px}
#ov h2{font-family:var(--display);font-weight:400;font-size:1.7rem;color:#ffd23f;text-shadow:0 3px 0 var(--ink),0 0 20px rgba(255,190,60,.35)}
#ov p{font-size:15px;color:#e9e0ff}
#ov p b{color:#fff}
.b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.02em;border:3px solid var(--ink);border-radius:16px;padding:13px 16px;
  background:linear-gradient(180deg,#4a3870,#2e2147);box-shadow:0 5px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.14);text-shadow:0 2px 0 var(--ink)}
.b:hover{border-color:var(--ink);box-shadow:0 5px 0 var(--ink),0 0 22px rgba(255,210,63,.3),inset 0 2px 0 rgba(255,255,255,.18)}
.b:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.b.primary{background:linear-gradient(180deg,#ffcf4a,#ff8a1c);color:#3a1a00;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.b small{font-family:system-ui,sans-serif;font-size:12px}
#joystick-hint{font-family:var(--display);font-size:15px;opacity:.75;text-shadow:0 2px 0 var(--ink);bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
#tdbar button{font-family:var(--display)!important;font-weight:400!important;font-size:13px!important;border-width:3px!important;border-radius:12px!important;box-shadow:0 4px 0 #120a1e}

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <span id="hp">❤️ 100</span>
  <span id="timer">0:00</span>
  <span id="kills">☠ 0</span>
  <span id="lv">Liv. 1</span>
</div>
<div id="curbar" style="position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 38px);text-align:center;font-size:13px;font-weight:600;z-index:10;pointer-events:none;text-shadow:0 1px 3px #000">
  <span id="cur" style="background:rgba(0,0,0,.45);padding:3px 10px;border-radius:16px">🧦0  🧀0  🍉0</span>
</div>
<div id="bar-wrap"><div id="fill"></div></div>
<div id="hpbar-wrap"><div id="hpfill"></div></div>
<button id="pb" onclick="pauseMenu()">⏸</button>
<div id="ov"></div>
<div id="joystick-hint">Muovi con il dito o WASD</div>
<script>
const cv=document.getElementById('c'),ov=document.getElementById('ov');
let ctx=cv.getContext('2d'); // let: il motore grafico disegna anche su canvas fuori schermo
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){if(typeof r==='number')r={tl:r,tr:r,br:r,bl:r};else r=Object.assign({tl:0,tr:0,br:0,bl:0},r);this.moveTo(x+r.tl,y);this.arcTo(x+w,y,x+w,y+h,r.tr);this.arcTo(x+w,y+h,x,y+h,r.br);this.arcTo(x,y+h,x,y,r.bl);this.arcTo(x,y,x+w,y,r.tl);return this}}
let W,H,dpr=1;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);rs();

// ========== STATE ==========
let P,E,D,B,CT,ctcd,SL,ncd,HR,hcd,X,G,trt,bt,tm,TW,WM,wp,t,socks,cheese,melons,xp,need,lvl,paused,over,cd,aura,ang,spawn,joy,keys={},kills=0;
let particles=[], floatTexts=[], camShake=0, hurtFlash=0;
let finalDefeated=false, miniBossTimer=0, miniBossPower=1, xavSpawned=false;
let ambDust=[];
// Wave / TD mode
let gameMode='classic'; // 'classic' | 'wave' | 'td'
let wave=1, wavePhase='announce', waveTimer=0, waveToSpawn=0, waveSpawnCd=0, waveAnnounce=0;
// Tower Defense
let house={x:0,y:0,hp:500,mh:500};
let tdSpots=[], tdTowers=[], tdSelected=null, tdInspect=null, tdBuildFlash=0, tdPath=[], tdPathLen=0;
const TD_MAX_LVL=5;
const TD_TOWERS={
  sock:{name:'🧦 Calzino',cost:8,desc:'Lancio singolo',range:200,cd:0.65,dmg:14},
  cheese:{name:'🧀 Formaggio',cost:18,desc:'Aura + slow',range:105,cd:0.4,dmg:5},
  melon:{name:'🍉 Anguria',cost:22,desc:'Orbite',range:125,cd:0.38,dmg:10},
  nails:{name:'💅 Unghie',cost:16,desc:'Graffio vicino',range:90,cd:0.5,dmg:22},
  hair:{name:'🔫 Peli',cost:20,desc:'Raffica + slow',range:230,cd:0.11,dmg:4},
  kick:{name:'👟 Scarpa',cost:28,desc:'Colpo forte',range:240,cd:1.0,dmg:34},
  drone:{name:'🤖 Drone',cost:35,desc:'Mira auto',range:270,cd:0.45,dmg:16},
  tr:{name:'🚂 TR',cost:55,desc:'Esplosione area',range:190,cd:2.2,dmg:58}
};

function initTdPath(){
  // Classic TD lane: entrance → zig-zag → house
  tdPath=[
    {x:0,y:480},
    {x:-300,y:400},
    {x:-300,y:160},
    {x:300,y:160},
    {x:300,y:-40},
    {x:-260,y:-40},
    {x:-260,y:-220},
    {x:200,y:-220},
    {x:200,y:-320},
    {x:0,y:-320},
    {x:0,y:-50}
  ];
  tdPathLen=0;
  for(let i=1;i<tdPath.length;i++){
    tdPathLen+=Math.hypot(tdPath[i].x-tdPath[i-1].x,tdPath[i].y-tdPath[i-1].y);
  }
}
function initTdSpots(){
  tdSpots=[];
  initTdPath();
  // spots offset left/right along each path segment
  for(let i=0;i<tdPath.length-1;i++){
    const a=tdPath[i],b=tdPath[i+1];
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len,ny=dx/len; // perpendicular
    const steps=Math.max(1,Math.floor(len/95));
    for(let s=1;s<=steps;s++){
      const t=s/(steps+1);
      const cx=a.x+dx*t,cy=a.y+dy*t;
      // left and right of path
      for(const side of [-1,1]){
        const ox=cx+nx*side*72,oy=cy+ny*side*72;
        // skip if too close to another spot or house
        if(Math.hypot(ox-house.x,oy-house.y)<90)continue;
        let tooClose=false;
        for(const sp of tdSpots){if(Math.hypot(sp.x-ox,sp.y-oy)<55){tooClose=true;break}}
        if(tooClose)continue;
        tdSpots.push({x:ox,y:oy,id:tdSpots.length});
      }
    }
  }
  // a few extra near the house for last-line defense
  for(let i=0;i<6;i++){
    const a=i*6.28/6+0.3;
    const ox=Math.cos(a)*110,oy=Math.sin(a)*110;
    let tooClose=false;
    for(const sp of tdSpots){if(Math.hypot(sp.x-ox,sp.y-oy)<50){tooClose=true;break}}
    if(!tooClose)tdSpots.push({x:ox,y:oy,id:tdSpots.length});
  }
}
function pathPointAt(dist){
  // dist along path from start; returns {x,y,seg}
  if(dist<=0)return {x:tdPath[0].x,y:tdPath[0].y,seg:0,prog:0};
  let left=dist;
  for(let i=0;i<tdPath.length-1;i++){
    const a=tdPath[i],b=tdPath[i+1];
    const seg=Math.hypot(b.x-a.x,b.y-a.y)||1;
    if(left<=seg){
      const t=left/seg;
      return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,seg:i,prog:dist};
    }
    left-=seg;
  }
  const last=tdPath[tdPath.length-1];
  return {x:last.x,y:last.y,seg:tdPath.length-2,prog:tdPathLen};
}
function towerRange(tw){
  const def=TD_TOWERS[tw.type];
  return def.range*(1+0.06*(tw.lvl-1));
}
function towerDmg(tw){
  const def=TD_TOWERS[tw.type];
  return def.dmg*(1+0.22*(tw.lvl-1));
}
function towerCd(tw){
  const def=TD_TOWERS[tw.type];
  return def.cd*(1-0.06*Math.min(tw.lvl-1,4));
}
function towerUpgradeCost(tw){
  const def=TD_TOWERS[tw.type];
  return Math.floor(def.cost*(0.7+tw.lvl*0.55));
}
function towerInvested(tw){
  const def=TD_TOWERS[tw.type];
  let c=def.cost;
  for(let l=1;l<tw.lvl;l++)c+=Math.floor(def.cost*(0.7+l*0.55));
  return c;
}
function towerSellValue(tw){return Math.floor(towerInvested(tw)*0.6)}

function init(){
  P={x:0,y:0,hp:100,mh:100,vx:0,vy:0,facing:1,walk:0,hurt:0,attack:0};
  E=[];D=[];B=[];CT=[];ctcd=1;SL=[];ncd=0;HR=[];hcd=0;X=[];G=[];
  trt=25;bt=120;tm={};TW=[];WM=[];
  wp={sock:1,cheese:0,melon:0,ct:0,nails:0,hair:0,knife:0,kick:0,fart:0,web:0,drone:0,dand:0,lion:0,tr:0};
  t=0;socks=cheese=melons=xp=0;need=5;lvl=1;paused=over=false;cd=0;aura=0;ang=0;spawn=0;kills=0;
  particles=[];floatTexts=[];camShake=0;hurtFlash=0;
  finalDefeated=false;miniBossTimer=0;miniBossPower=1;xavSpawned=false;
  wave=1;wavePhase='announce';waveTimer=2.2;waveToSpawn=0;waveSpawnCd=0;waveAnnounce=2.2;
  house={x:0,y:0,hp:500,mh:500};
  tdTowers=[];tdSelected=null;tdInspect=null;tdBuildFlash=0;
  initTdSpots();
  ambDust=[];
  for(let i=0;i<28;i++)ambDust.push({x:0,y:0,vx:(Math.random()-.5)*12,vy:-(8+Math.random()*18),life:Math.random()*4,max:3+Math.random()*3,r:1+Math.random()*2.2});
  ov.style.display='none';
}
init();

// Input
onpointerdown=e=>{
  if(paused||over)return;
  if(gameMode==='td'){
    // convert screen to world (camera on house)
    const wx=e.clientX-(W/2-house.x), wy=e.clientY-(H/2-house.y);
    // click existing tower → inspect / upgrade UI
    let hitTw=null,bdTw=28*28;
    for(const tw of tdTowers){
      const d=(tw.x-wx)**2+(tw.y-wy)**2;
      if(d<bdTw){bdTw=d;hitTw=tw}
    }
    if(hitTw&&!tdSelected){
      openTowerMenu(hitTw);
      return;
    }
    // if a tower type is selected, try place
    if(tdSelected){
      let best=null,bd=55*55;
      for(const sp of tdSpots){
        if(spotOccupied(sp.id))continue;
        const d=(sp.x-wx)**2+(sp.y-wy)**2;
        if(d<bd){bd=d;best=sp}
      }
      if(best){placeTower(best.id,tdSelected);return}
      // tap empty → deselect
      tdSelected=null;showTdBar();
      return;
    }
  }
  joy={x:e.clientX,y:e.clientY,dx:0,dy:0};
};
onpointermove=e=>{if(joy){let dx=e.clientX-joy.x,dy=e.clientY-joy.y,l=Math.hypot(dx,dy),m=55;if(l>m){joy.x=e.clientX-dx/l*m;joy.y=e.clientY-dy/l*m;dx=dx/l*m;dy=dy/l*m}joy.dx=dx/m;joy.dy=dy/m}};
onpointerup=()=>joy=null;
onkeydown=e=>keys[e.key]=1;onkeyup=e=>keys[e.key]=0;

const NAMES={sock:'🧦 Calzino lanciato',cheese:'🧀 Aura puzzolente',melon:'🍉 Angurie orbitanti',ct:'👦 CT lanciato (boomerang)',nails:'💅 Unghie di KH (graffio)',hair:'🔫 Mitraglietta di peli (rallenta)',tr:'🚂 TR (treno esplosivo)',knife:'🔪 Coltellino del nonno',kick:'👟 Calcio (scarpa)',fart:'💨 Scatto con scoreggia',web:'🕸️ Spara-ragnatele',drone:'🤖 Drone autonomo',dand:'❄️ Pioggia di forfora',lion:'🦁 Furia del vero leone'};
const EVN={sock:'ECHIC',cheese:'Fetore immondo',nails:'Graffio mortale',knife:'Cappuccino assassino',ct:'CiroTondo',kick:'Scarpa della gru',dand:'Grande fungo',web:'Aoh',drone:'Drone Karol',melon:'Shacka Rocka',hair:'Peli Gatling',tr:'Per Allah',lion:'Ira Dei WGF'};
const EVN2={sock:'CALZINO APOCALITTICO',cheese:'PESTE UNIVERSALE',melon:'ANGURIE DIVINE',ct:'CIROTONDO SUPREMO',nails:'ARTIGLI DELL’APOCALISSE',hair:'PELI GATLING OMEGA',tr:'TR DISTRUTTORE',knife:'CAPPUCCINO DELLA MORTE',kick:'SCARPA DIVINA',fart:'TELETRASPORTO TOSSICO',web:'RAGNATELA DIMENSIONALE',drone:'DRONE KAROL OMEGA',dand:'TEMPESTA GLACIALE',lion:'IRA DIVINA'};

function maxWeaponLvl(){return SV.limiterOff?100:5}

function levelUp(){
  paused=true;joy=null;lvl++;xp=0;P.mh*=1.03;P.hp+=P.mh*.03;need=Math.floor(need*1.35)+3;
  const maxL=maxWeaponLvl();
  ov.innerHTML='<h2 style="margin-bottom:8px">⭐ Livello '+lvl+'!</h2><p style="opacity:.85;margin-bottom:12px">Scegli un potenziamento'+(SV.limiterOff?' <small>(limite rimosso)</small>':'')+'</p>';
  const opts=Object.keys(NAMES).filter(k=>wp[k]<maxL).sort(()=>Math.random()-.5).slice(0,3);
  if(opts.length===0){ov.innerHTML+='<p>Tutte le armi al massimo!</p>';btn('Continua',()=>{ov.style.display='none';paused=false});ov.style.display='flex';return}
  for(const k of opts){
    const b=document.createElement('button');b.className='b';
    const cur=wp[k], next=cur+1;
    const isEvo=cur===3&&EVN[k];
    const isEvo2=cur===4&&EVN2[k];
    let rarity='COMUNE', borderCol='#8d99ae', bg='linear-gradient(180deg,#3d2e55,#2a1f3d)';
    if(isEvo2){rarity='MITICA';borderCol='#ffd23f';bg='linear-gradient(180deg,#5a3a00,#3d2800)'}
    else if(isEvo){rarity='EPICA';borderCol='#c77dff';bg='linear-gradient(180deg,#4a2d6a,#2e1a45)'}
    else if(cur===0){rarity='NUOVA';borderCol='#4cc9f0'}
    else if(cur>=2){rarity='RARA';borderCol='#4cc9f0'}
    b.style.borderColor=borderCol;
    b.style.background=bg;
    let title=NAMES[k];
    let sub='';
    if(isEvo2){title='⭐⭐ '+EVN2[k]; sub='<div style="color:#ffd23f;font-size:12px;margin-top:4px">Seconda Evoluzione</div>'}
    else if(isEvo){title='⭐ '+EVN[k]; sub='<div style="color:#c77dff;font-size:12px;margin-top:4px">Evoluzione</div>'}
    b.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:11px;opacity:.7;letter-spacing:1px">'+rarity+'</span><span style="font-size:12px;opacity:.8">Lv.'+cur+' → '+next+'</span></div><div style="font-size:15px;font-weight:700">'+title+'</div>'+sub+(cur===0?'<div style="font-size:12px;opacity:.7;margin-top:4px">Nuova arma</div>':'');
    b.onclick=()=>{wp[k]++;ov.style.display='none';paused=false};
    ov.appendChild(b);
  }
  ov.style.display='flex';
}

function near(x,y,r){let b=null,bd=r*r;for(const e of E){const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;b=e}}return b}

function spawnP(x,y,n,col,spd=90,life=.45,type='dot',vx=0,vy=0){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28,s=spd*(.35+Math.random()*.75);
    particles.push({x,y,vx:vx+Math.cos(a)*s,vy:vy+Math.sin(a)*s,life,max:life,col,r:1.5+Math.random()*3.5,type,rot:Math.random()*6.28,spin:(Math.random()-.5)*12});
  }
}

  const dealt=Math.max(1,Math.round(dmg));
  e.hp-=dealt;
  e.f=0.18;e.hurt=0.28;
  if(P){const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;e.kbx=(dx/d)*(wtype==='kick'||wtype==='tr'?140:70);e.kby=(dy/d)*(wtype==='kick'||wtype==='tr'?140:70)}

  else if(wtype==='hair'){spawnP(e.x,e.y,5,'#6b4423',50,.3,'feather')}
  else if(wtype==='tr'){spawnP(e.x,e.y,22,'#ff4500',160,.55,'smoke');spawnP(e.x,e.y,10,'#ffd23f',120,.4,'spark');camShake=.25}
  else if(wtype==='knife'){spawnP(e.x,e.y,10,'#c0c0c0',100,.3,'spark');spawnP(e.x,e.y,4,'#fff',70,.25,'spark')}
  else if(wtype==='kick'){spawnP(e.x,e.y,14,'#8d99ae',110,.4,'smoke');spawnP(e.x,e.y,6,'#ffd23f',80,.3,'spark');camShake=.15}

  else{spawnP(e.x,e.y,5,'#ffaa55',60,.35,'dot')}

  if(e.hp<=0&&!e.dead){
    e.dead=1;
    kills++;
    spawnP(e.x,e.y,18,'#ff8c1a',140,.55,'smoke');

function hasFullSet(){
  return SV.clothes.shirt&&SV.clothes.pants&&SV.clothes.hat&&SV.clothes.socks;
}

function isBossWave(w){
  return w===10||w===20||w===30||w===40||(w>40&&w%10===0);
}
function bossTypeForWave(w){
  if(w===10)return 'ORU';
  if(w===20)return 'POM';
  if(w===30)return 'TOJI';
  if(w===40)return 'XAV';
  // beyond 40, cycle
  const cycle=['ORU','POM','TOJI','XAV'];
  return cycle[Math.floor((w-10)/10)%4];
}
function waveEnemyCount(w){
  if(isBossWave(w))return 10;
  // ondate molto più affollate
  return Math.min(160, 22 + Math.floor(w*4.5) + (w>8?Math.floor((w-8)*3):0) + (w>20?Math.floor((w-20)*2.5):0));
}
function waveHpMul(w){return 1+(w-1)*0.14+(w>20?(w-20)*0.04:0)}
function waveSpMul(w){return 1+Math.min(1.4,(w-1)*0.035)}
function spawnPosAround(cx,cy,minR,maxR){
  const a=Math.random()*6.28,r=minR+Math.random()*(maxR-minR);
  return {x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r};
}
function spawnWaveEnemy(ty,nm,towardHouse){
  const mul=waveHpMul(wave), spm=waveSpMul(wave);
  let pos, pathProg=0;
  if(towardHouse&&tdPath.length){
    // spawn at path start with slight lateral jitter
    const start=tdPath[0];
    const jitter=(Math.random()-.5)*28;
    pos={x:start.x+jitter,y:start.y+(Math.random()-.5)*16};
    pathProg=0;
  }else{
    const target={x:P.x,y:P.y};
    pos=spawnPosAround(target.x,target.y,Math.max(W,H)*0.55,Math.max(W,H)*0.78);
  }
  if(ty==='k'){
    let hb=42*(12+wave*1.8)*mul;
    if(nm==='XAV')hb*=3.2;
    else if(nm==='TOJI')hb*=1.35;
    else if(nm==='POM')hb*=1.15;
    if(gameMode==='td')hb*=0.85;
    E.push({ty:'k',r:nm==='XAV'?44:30,x:pos.x,y:pos.y,hp:hb,mh:hb,nm,sp:0,f:0,s:'',st:'w',tm:3.5,sh:.5,a:0,hurt:0,walk:0,phase:1,waveBoss:1,td:towardHouse?1:0,pathProg,pathSp:55+wave*1.2});
  }else{
    const bh=(12+wave*1.6)*mul*(gameMode==='td'?0.9:1);
    const bs=(42+Math.min(wave,40)*1.4)*spm*(gameMode==='td'?0.85:1);
    E.push({ty,x:pos.x,y:pos.y,hp:ty==='b'?bh*4.5:bh,sp:ty==='l'?bs*1.85:bs,f:0,s:'',hurt:0,walk:0,r:ty==='b'?24:17,kbx:0,kby:0,td:towardHouse?1:0,pathProg,pathSp:bs});
  }
}
function beginWave(w){
  wave=w;
  wavePhase='announce';
  waveTimer=2.4;
  waveAnnounce=2.4;
  waveToSpawn=0;
  waveSpawnCd=0;
  const anchor=gameMode==='td'?house:P;
  const label=isBossWave(w)
    ?('ONDATA '+w+' — 10 '+bossTypeForWave(w)+'!')
    :('ONDATA '+w);
  floatDmg(anchor.x,anchor.y-70,label,isBossWave(w)?'#ff6b6b':'#ffd23f');
  if(isBossWave(w))camShake=.2;
  // reward socks between waves in TD
  if(gameMode==='td'&&w>1){
    const bonus=12+w*3;
    socks+=bonus;
    floatDmg(house.x,house.y-40,'+'+bonus+' 🧦', '#a8dadc');
  }
}
function updateWave(dt){
  if(wavePhase==='announce'){
    waveTimer-=dt;
    if(waveTimer<=0){
      wavePhase='spawn';
      waveToSpawn=waveEnemyCount(wave);
      waveSpawnCd=0.05;
    }
    return;
  }
  if(wavePhase==='spawn'){
    waveSpawnCd-=dt;
    if(waveSpawnCd<=0&&waveToSpawn>0){
      const interval=isBossWave(wave)?0.32:Math.max(0.06,0.22-wave*0.004);
      waveSpawnCd=interval;
      const toward=gameMode==='td';
      if(isBossWave(wave)){
        spawnWaveEnemy('k',bossTypeForWave(wave),toward);
      }else{
        const ro=Math.random();
        let ty='n';
        if(wave>=3&&ro<0.2+Math.min(0.22,wave*0.01))ty='b';
        else if(wave>=2&&ro<0.42)ty='l';
        spawnWaveEnemy(ty,null,toward);
      }
      waveToSpawn--;
    }
    if(waveToSpawn<=0)wavePhase='fight';
  }
  if(wavePhase==='fight'||wavePhase==='spawn'){
    const alive=E.filter(e=>!e.dead&&e.ty!=='t').length;
    if(waveToSpawn<=0&&alive===0){
      wavePhase='clear';
      // TD: longer build phase between waves
      waveTimer=gameMode==='td'?3.8:1.6;
      const anchor=gameMode==='td'?house:P;
      floatDmg(anchor.x,anchor.y-55,gameMode==='td'?('BUILD TIME · Ondata '+wave+' ok'):('ONDATA '+wave+' SUPERATA!'),'#4cc9f0');
      if(gameMode!=='td'){
        P.hp=Math.min(P.mh,P.hp+P.mh*0.12);
        xp+=Math.floor(4+wave*1.5);
        socks+=Math.min(5,2+Math.floor(wave/6));
      }else{
        house.hp=Math.min(house.mh,house.hp+house.mh*0.1);
        socks+=10+Math.floor(wave*2.8);
        showTdBar();
      }
      if(gameMode==='wave'){
        if(SV.bestWave===undefined)SV.bestWave=0;
        if(wave>SV.bestWave){SV.bestWave=wave;sv()}
      }
      if(gameMode==='td'){
        if(!SV.bestTd)SV.bestTd=0;
        if(wave>SV.bestTd){SV.bestTd=wave;sv()}
      }
    }
  }
  if(wavePhase==='clear'){
    waveTimer-=dt;
    if(waveTimer<=0)beginWave(wave+1);
  }
}

function spotOccupied(id){return tdTowers.some(t=>t.spot===id)}
function placeTower(spotId,type){
  const def=TD_TOWERS[type];
  if(!def||socks<def.cost||spotOccupied(spotId))return false;
  const sp=tdSpots[spotId];
  if(!sp)return false;
  socks-=def.cost;
  tdTowers.push({spot:spotId,type,x:sp.x,y:sp.y,cd:0.25,ang:0,lvl:1});
  spawnP(sp.x,sp.y,12,'#ffd23f',70,.4,'spark');

  showTdBar();
  return true;
}
function upgradeTower(tw){

function sellTower(tw){

// Targeting priority: FIRST on the path (most advanced), classic TD style
function pickTdTarget(x,y,range){
  let best=null,bestProg=-1;
  const r2=range*range;
  for(const e of E){
    if(e.dead||e.ty==='t')continue;
    const d=(e.x-x)**2+(e.y-y)**2;
    if(d>r2)continue;
    const prog=e.pathProg||0;
    if(prog>bestProg){bestProg=prog;best=e}
  }
  return best;
}
function nearestEnemy(x,y,range){return pickTdTarget(x,y,range)}
function updateTowers(dt){
  for(const tw of tdTowers){
    const def=TD_TOWERS[tw.type];
    if(!def)continue;
    tw.cd-=dt;
    tw.ang=(tw.ang||0)+dt*(2.2+tw.lvl*0.15);
    if(tw.cd>0)continue;
    const rng=towerRange(tw);
    const tg=pickTdTarget(tw.x,tw.y,rng);
    if(!tg)continue;
    tw.cd=towerCd(tw);
    const dmg=towerDmg(tw);
    if(tw.type==='sock'){
      const a=Math.atan2(tg.y-tw.y,tg.x-tw.x);
      const n=tw.lvl>=4?2:1;
      for(let i=0;i<n;i++){
        const off=(i-(n-1)/2)*0.12;
        B.push({x:tw.x,y:tw.y,vx:Math.cos(a+off)*360,vy:Math.sin(a+off)*360,life:1.1,d:dmg,type:'sock',rot:0,spin:12,td:1});
      }
    }else if(tw.type==='cheese'){
      for(const e of E)if(!e.dead&&(e.x-tw.x)**2+(e.y-tw.y)**2<rng*rng){
        hit(e,dmg,'cheese');e.sl=Math.max(e.sl||0,0.6+tw.lvl*0.15);
      }
      spawnP(tw.x,tw.y,5+tw.lvl,'#ffd23f',40,.35,'smoke');
    }else if(tw.type==='melon'){
      const orbs=3+Math.floor((tw.lvl-1)/2);
      for(let i=0;i<orbs;i++){
        const a=tw.ang+i*(6.28/orbs);
        const mx=tw.x+Math.cos(a)*(60+tw.lvl*6),my=tw.y+Math.sin(a)*(60+tw.lvl*6);
        for(const e of E)if(!e.dead&&(e.x-mx)**2+(e.y-my)**2<1000)hit(e,dmg*0.75,'melon');
      }
    }else if(tw.type==='nails'){
      for(const e of E)if(!e.dead&&(e.x-tw.x)**2+(e.y-tw.y)**2<rng*rng)hit(e,dmg,'nails');
      SL.push({a:Math.atan2(tg.y-tw.y,tg.x-tw.x),R:rng,l:.2,w:1.0+tw.lvl*0.15,type:'nails',ox:tw.x,oy:tw.y});
    }else if(tw.type==='hair'){
      const a=Math.atan2(tg.y-tw.y,tg.x-tw.x)+(Math.random()-.5)*.2;
      HR.push({x:tw.x,y:tw.y,vx:Math.cos(a)*480,vy:Math.sin(a)*480,life:.85,a,rot:0,td:1,d:dmg});
      tg.sl=Math.max(tg.sl||0,0.8);
    }else if(tw.type==='kick'){
      const a=Math.atan2(tg.y-tw.y,tg.x-tw.x);
      B.push({x:tw.x,y:tw.y,vx:Math.cos(a)*340,vy:Math.sin(a)*340,life:1.2,d:dmg,type:'kick',rot:0,spin:10,td:1});
    }else if(tw.type==='drone'){
      const a=Math.atan2(tg.y-tw.y,tg.x-tw.x);
      B.push({x:tw.x,y:tw.y,vx:Math.cos(a)*400,vy:Math.sin(a)*400,life:.9,d:dmg,type:'drone',rot:0,td:1});
    }else if(tw.type==='tr'){
      const a=Math.atan2(tg.y-tw.y,tg.x-tw.x);
      TW.push({x:tw.x,y:tw.y,vx:Math.cos(a)*320,vy:Math.sin(a)*320,life:1.5,rot:a,td:1,d:dmg});
    }
  }
}
function updateTdEnemies(dt){
  for(const e of E){
    if(e.dead||e.ty==='t')continue;
    // path following for all TD enemies (bosses too)
    const sm=e.tr>0?0:e.sl>0?.45:1;
    const spd=(e.pathSp||e.sp||50)*sm;
    e.pathProg=(e.pathProg||0)+spd*dt;
    if(e.pathProg>=tdPathLen-8){
      // reached the house
      const dmg=e.ty==='k'?(e.nm==='XAV'?40:25):(e.ty==='b'?18:e.ty==='l'?11:8);
      house.hp-=dmg;
      e.dead=1;
      spawnP(e.x,e.y,12,'#e63946',90,.4,'smoke');
      camShake=.12;
      floatDmg(house.x,house.y-40,'-'+Math.round(dmg)+' 🏠','#e63946');
      continue;
    }
    const pt=pathPointAt(e.pathProg);
    // smooth move toward path point (allows slight lag for juice)
    e.x+=(pt.x-e.x)*Math.min(1,dt*12);
    e.y+=(pt.y-e.y)*Math.min(1,dt*12);
    e.walk=(e.walk||0)+dt*6;
  }
  if(house.hp<=0&&!over){
    house.hp=0;over=true;
    SV.ch+=cheese-(P.bk||0);P.bk=cheese;
    SV.bestTd=Math.max(SV.bestTd||0,wave);sv();
    deathUI();
  }
}

function update(dt){
  t+=dt;
  let mx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),
      my=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
  if(joy){mx=joy.dx;my=joy.dy}
  const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
  let spdv=170*(1+.05*SV.up.spd);
  if(hasFullSet())spdv*=1.5;
  P.vx=mx*spdv;P.vy=my*spdv;
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  if(l>0.1){P.facing=mx>=0?1:-1;P.walk+=dt*10}else P.walk*=0.9;
  if(P.hurt>0)P.hurt-=dt;
  if(P.attack>0)P.attack-=dt;
  if(hurtFlash>0)hurtFlash-=dt;

  // Train hazard: classic only (or rare in late waves)
  if(gameMode==='classic'){
    trt-=dt;
    if(trt<=0&&t>25){
      trt=20+Math.random()*8;
      const ta=Math.random()*6.28,tr=Math.max(W,H)*.7;

      const td=Math.hypot(P.x-sx,P.y-sy)||1;
      E.push({ty:'t',x:sx,y:sy,tgx:P.x,tgy:P.y,vx:(P.x-sx)/td*300,vy:(P.y-sy)/td*300,hp:50,sp:0,f:0,s:'',hurt:0,walk:0});
    }
  }

  if(gameMode==='classic'){
    if(t>=bt && !xavSpawned){
      let nmx=0;
      if(bt===120){nmx=0;bt=420}
      else if(bt===420){nmx='ORU';bt=720}
      else if(bt===720){nmx='POM';bt=1020}
      else if(bt===1020){nmx='TOJI';bt=1500}
      else if(bt===1500){nmx='XAV';bt=1e9;xavSpawned=true}
      if(nmx){
        const ka=Math.random()*6.28,kr=Math.max(W,H)*.65;
        let hb=50*(15+t/6);
        if(nmx==='XAV')hb=hb*4.5;
        E.push({ty:'k',r:nmx==='XAV'?48:34,x:P.x+Math.cos(ka)*kr,y:P.y+Math.sin(ka)*kr,hp:hb*(nmx==='XAV'?1:1.5),mh:hb*(nmx==='XAV'?1:1.5),nm:nmx,sp:0,f:0,s:'',st:'w',tm:4,sh:.5,a:0,hurt:0,walk:0,phase:1});
      }
    }

    if(finalDefeated){
      miniBossTimer-=dt;

    w.x+=w.vx*dt;w.y+=w.vy*dt;w.life-=dt;
    if(Math.random()<.7)spawnP(w.x,w.y,1,'#ff6b35',35,.28,'smoke');
    if(E.find(e=>(e.x-w.x)**2+(e.y-w.y)**2<900)||w.life<=0){
      w.done=1;const RR=w.td?(140+((w.d||50)*0.4)): (VV('tr')?300:V('tr')?190:110);
      X.push({x:w.x,y:w.y,l:.5,r:RR});
      for(const e of E)if(Math.hypot(e.x-w.x,e.y-w.y)<RR)hit(e,w.td?(w.d||55):((40+wp.tr*12)*(VV('tr')?2:1)),'tr');
      spawnP(w.x,w.y,VV('tr')?42:28,'#ff4500',180,.6,'smoke');
      spawnP(w.x,w.y,VV('tr')?20:14,'#ffd23f',130,.45,'spark');
      if(VV('tr'))spawnP(w.x,w.y,12,'#fff',90,.4,'spark');
      camShake=.3+(VV('tr')?.15:0);
    }
  }
  TW=TW.filter(w=>!w.done);

  for(const w of WM){
    w.l+=dt;
    if(w.l<1.2){w.x+=(w.tx-w.x)*Math.min(1,dt*3);w.y+=(w.ty-w.y)*Math.min(1,dt*3)}
    else if(!w.sp&&w.l>2.2){
      w.sp=1;X.push({x:w.x,y:w.y,l:.45,r:40});
      for(let i=0;i<4;i++){const a=i*1.57;E.push({ty:'j',x:w.x+Math.cos(a)*20,y:w.y+Math.sin(a)*20,hp:25+t/10,sp:95,f:0,s:'',hurt:0,walk:0})}
    }
    if(w.l>3)w.done=1;
    if(!w.sp&&Math.hypot(P.x-w.x,P.y-w.y)<22)P.hp-=10*dt;
  }
  WM=WM.filter(w=>!w.done);

  for(const s of SL)s.l-=dt;SL=SL.filter(s=>s.l>0);
  E=E.filter(e=>!e.dead);

  // Pickups + MAGNET
  const magnetRange = SV.magnet ? 280 : 90;
  const magnetSpeed = SV.magnet ? 480 : 320;
  for(const d of D){
    const dx=P.x-d.x,dy=P.y-d.y,dist=Math.hypot(dx,dy);
    if(d.k!='g' && dist < magnetRange){
      d.x+=dx/dist*magnetSpeed*dt;
      d.y+=dy/dist*magnetSpeed*dt;
    }
    if(d.k=='g'){
      if(dist<34){d.got=1;socks+=20;xp+=20;cheese+=10;melons+=3;P.hp=P.mh;tm.ea=1.5;spawnP(d.x,d.y,16,'#ffd23f',100,.5,'spark')}
    }else if(dist<18){
      d.got=1;
      if(d.k=='s'){socks++;xp++;if(!SV.clothes.socks&&socks>=10){SV.clothes.socks=1;sv();floatDmg(P.x,P.y-50,'CALZINI SBLOCCATI!','#a8dadc')}spawnP(d.x,d.y,7,'#a8dadc',55,.3,'dot')}
      else if(d.k=='b'){xp+=Math.max(8,need*.6);spawnP(d.x,d.y,9,'#ffd23f',70,.35,'spark')}
      else if(d.k=='c'){cheese++;spawnP(d.x,d.y,7,'#ffd23f',55,.3,'smoke')}
      else if(d.k=='pants'){if(!SV.clothes.pants){SV.clothes.pants=1;sv();floatDmg(P.x,P.y-50,'SIDE QUEST: PANTALONI COMPLETATA!','#ffd23f')}spawnP(d.x,d.y,12,'#3a6ea5',80,.4,'spark')}
      else if(d.k=='shirt'){if(!SV.clothes.shirt){SV.clothes.shirt=1;sv();floatDmg(P.x,P.y-50,'SIDE QUEST: MAGLIETTA DB!','#ff6b00')}spawnP(d.x,d.y,12,'#ff6b00',80,.4,'spark')}
      else if(d.k=='hat'){if(!SV.clothes.hat){SV.clothes.hat=1;sv();floatDmg(P.x,P.y-50,'CAPPELLO OTTENUTO!','#a78bfa')}spawnP(d.x,d.y,12,'#a78bfa',80,.4,'spark')}
      else{melons++;P.hp=Math.min(P.mh,P.hp+15);spawnP(d.x,d.y,7,'#e63946',55,.3,'dot')}
      checkSetBonus();
    }
  }
  D=D.filter(d=>!d.got);

  for(const p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    p.vx*=.94;p.vy*=.94;
    if(p.type==='feather'||p.type==='gas')p.vy+=25*dt;
    if(p.spin)p.rot+=p.spin*dt;
  }
  particles=particles.filter(p=>p.life>0);
  if(particles.length>180)particles.splice(0,particles.length-180);

  for(const f of floatTexts){f.y+=f.vy*dt;f.life-=dt;f.vy*=.92}
  floatTexts=floatTexts.filter(f=>f.life>0);
  if(camShake>0)camShake-=dt;

  // ambient dust drifts around the player
  for(const d of ambDust){
    d.life-=dt;
    d.x+=d.vx*dt;d.y+=d.vy*dt;
    d.vx*=0.98;d.vy*=0.99;
    if(d.life<=0){
      d.x=P.x+(Math.random()-.5)*W*0.9;
      d.y=P.y+(Math.random()-.5)*H*0.9;
      d.vx=(Math.random()-.5)*14;
      d.vy=-(6+Math.random()*16);
      d.life=d.max=2.5+Math.random()*3.5;
      d.r=1+Math.random()*2.4;
    }
  }

  if(gameMode!=='td'&&xp>=need)levelUp();
  if(P.hp<=0){
    over=true;SV.ch+=cheese-(P.bk||0);P.bk=cheese;
    if(gameMode==='classic')SV.best=Math.max(SV.best,t|0);
    if(gameMode==='wave')SV.bestWave=Math.max(SV.bestWave||0,wave);
    sv();deathUI();return;
  }
}

function checkSetBonus(){

    SV.setBonusShown=1;sv();
    floatDmg(P.x,P.y-70,'SET COMPLETO! +50% STATS','#ffd23f');
  }
}

function trainAI(e,dt){
  e.x+=e.vx*dt;e.y+=e.vy*dt;
  const dp=Math.hypot(P.x-e.x,P.y-e.y);
  if(Math.hypot(e.tgx-e.x,e.tgy-e.y)<20||dp<26){
    X.push({x:e.x,y:e.y,l:.45,r:100});
    if(dp<100)P.hp-=35;
    for(const o of E)if(o!==e&&o.ty!='k'&&Math.hypot(o.x-e.x,o.y-e.y)<100)hit(o,60,'tr');
    e.dead=1;spawnP(e.x,e.y,28,'#ff3333',190,.6,'smoke');
  }
}
function bossAI(e,dt){
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,sm=e.sl>0?.7:1;
  e.tm-=dt;e.walk+=dt*4;
  if(e.st=='w'){
    e.x+=dx/d*45*sm*dt;e.y+=dy/d*45*sm*dt;
    e.sh-=dt;
    if(e.sh<=0){e.sh=1.3;for(let i=-1;i<=1;i++){const a=Math.atan2(dy,dx)+i*.28;G.push({x:e.x,y:e.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190,life:3})}}
    if(e.tm<=0){e.st='t';e.tm=1.2;e.a=Math.atan2(dy,dx)}
  }else if(e.st=='t'){
    if(e.tm<=0){e.st='c';e.tm=.6;e.ch=0}
  }else if(e.st=='c'){
    e.x+=Math.cos(e.a)*520*dt;e.y+=Math.sin(e.a)*520*dt;
    if(!e.ch&&Math.hypot(P.x-e.x,P.y-e.y)<42){e.ch=1;P.hp-=30;camShake=.25}
    if(e.tm<=0){e.st='r';e.tm=1}
  }else if(e.tm<=0){e.st='w';e.tm=4;e.sh=.5}
  if(e.st!='c'&&d<40)P.hp-=15*dt;
}
function oruAI(e,dt){
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,sm=e.sl>0?.7:1;
  e.tm-=dt;e.walk+=dt*5;
  if(e.st=='w'){
    e.x+=dx/d*70*sm*dt;e.y+=dy/d*70*sm*dt;
    if(e.tm<=0&&d<170){e.st='t';e.tm=1}else if(e.tm<=0)e.tm=.2;
  }else if(e.st=='t'){
    if(e.tm<=0){e.st='r';e.tm=1.2;X.push({x:e.x,y:e.y,l:.45,r:110});if(d<110){P.hp-=35;camShake=.3}spawnP(e.x,e.y,22,'#8B4513',130,.5,'smoke')}
  }else if(e.tm<=0){e.st='w';e.tm=3}
  if(e.st!='t'&&d<46)P.hp-=18*dt;
}
function pomAI(e,dt){
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,sm=e.sl>0?.7:1,v=d>200?40:0;
  e.x+=dx/d*v*sm*dt;e.y+=dy/d*v*sm*dt;e.walk+=dt*3;
  e.sh-=dt;e.rg=(e.rg??5)-dt;
  if(e.sh<=0){e.sh=1.3;for(let i=-2;i<=2;i++){const a=Math.atan2(dy,dx)+i*.2;G.push({x:e.x,y:e.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230,life:3,gd:1})}}
  if(e.rg<=0){e.rg=6.5;for(let i=0;i<14;i++){const a=i*6.28/14;G.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,life:3,gd:1})}}
  if(d<44)P.hp-=15*dt;
}
function tojAI(e,dt){
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,sm=e.sl>0?.7:1,v=d>120?55:0;
  e.x+=dx/d*v*sm*dt;e.y+=dy/d*v*sm*dt;e.walk+=dt*4;
  e.sh-=dt;
  if(e.sh<=0){e.sh=7;WM.push({x:e.x,y:e.y,tx:P.x,ty:P.y,l:0,sp:0})}
  if(d<44)P.hp-=18*dt;
}

function xavAI(e,dt){
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,sm=e.sl>0?.55:1;
  e.tm-=dt;e.walk+=dt*3;
  if(e.phase===1&&e.hp<e.mh*0.5){
    e.phase=2;e.st='rage';e.tm=2.5;
    X.push({x:e.x,y:e.y,l:.8,r:200});
    spawnP(e.x,e.y,40,'#7b2cbf',180,.7,'smoke');
    spawnP(e.x,e.y,20,'#ff0000',140,.5,'spark');
    camShake=.45;
    floatDmg(e.x,e.y-80,'FASE 2','#ff0000');
  }
  if(e.st==='rage'){
    if(e.tm<=0){e.st='w';e.tm=3;e.sh=.3}
    return;
  }
  if(e.st==='w'){
    const spd=e.phase===2?55:35;
    e.x+=dx/d*spd*sm*dt;e.y+=dy/d*spd*sm*dt;
    e.sh-=dt;
    if(e.sh<=0){
      e.sh=e.phase===2?0.9:1.4;
      e.st='slam';e.tm=0.9;e.a=Math.atan2(dy,dx);
    }
    if(e.tm<=0){e.st='charge';e.tm=1.4;e.a=Math.atan2(dy,dx)}
  }else if(e.st==='slam'){
    if(e.tm<=0){
      X.push({x:e.x,y:e.y,l:.55,r:e.phase===2?160:120});
      if(d<(e.phase===2?160:120)){P.hp-=e.phase===2?45:30;camShake=.35}
      spawnP(e.x,e.y,25,'#7b2cbf',150,.5,'smoke');
      for(let i=0;i<8;i++){
        const a=i*0.785;
        G.push({x:e.x,y:e.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,life:2.2,gd:0});
      }
      e.st='w';e.tm=3.5;e.sh=1;
    }
  }else if(e.st==='charge'){
    e.x+=Math.cos(e.a)*(e.phase===2?480:380)*dt;
    e.y+=Math.sin(e.a)*(e.phase===2?480:380)*dt;
    if(Math.hypot(P.x-e.x,P.y-e.y)<50){P.hp-=e.phase===2?40:25;camShake=.3}
    if(e.tm<=0){e.st='w';e.tm=4;e.sh=.6}
  }
  if(e.st!=='charge'&&e.st!=='slam'&&d<55)P.hp-=20*dt*(e.phase===2?1.3:1);
}

function normalizeSV(obj){
  const base={ch:0,up:{hp:0,dmg:0,spd:0},best:0,bestWave:0,bestTd:0,day:'',clothes:{shirt:0,pants:0,hat:0,socks:0},limiterOff:0,magnet:0,setBonusShown:0};
  if(!obj||typeof obj!=='object')return base;
  const out=Object.assign({},base,obj);
  out.up=Object.assign({hp:0,dmg:0,spd:0},obj.up||{});
  out.clothes=Object.assign({shirt:0,pants:0,hat:0,socks:0},obj.clothes||{});
  out.ch=Math.max(0,parseInt(out.ch)||0);
  out.best=Math.max(0,parseInt(out.best)||0);
  out.bestWave=Math.max(0,parseInt(out.bestWave)||0);
  out.bestTd=Math.max(0,parseInt(out.bestTd)||0);
  out.limiterOff=out.limiterOff?1:0;
  out.magnet=out.magnet?1:0;
  out.setBonusShown=out.setBonusShown?1:0;
  ['hp','dmg','spd'].forEach(k=>{out.up[k]=Math.max(0,Math.min(10,parseInt(out.up[k])||0))});
  ['shirt','pants','hat','socks'].forEach(k=>{out.clothes[k]=out.clothes[k]?1:0});
  return out;
}
function getSaveString(){
  return JSON.stringify(normalizeSV(SV));
}
function applySave(data){
  const parsed=typeof data==='string'?JSON.parse(data):data;
  const clean=normalizeSV(parsed);
  Object.keys(SV).forEach(k=>delete SV[k]);
  Object.assign(SV,clean);
  sv();
}
function copyTextReliable(str){
  // 1) modern clipboard
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(str).then(()=>true).catch(()=>false);
  }
  return Promise.resolve(false);
}
function fallbackCopy(str){
  const ta=document.createElement('textarea');
  ta.value=str;
  ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;left:0;top:0;width:90%;height:120px;opacity:0.01;z-index:9999';
  document.body.appendChild(ta);
  ta.focus();ta.select();ta.setSelectionRange(0,str.length);
  let ok=false;
  try{ok=document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);
  return ok;
}

// =====================================================================
// GRAFICA v5 — motore di disegno rifatto (la logica di gioco è invariata)
// - sprite pre-disegnati in cache, con contorno "cartoon" e lampo bianco
// - pavimento pre-renderizzato a blocchi (più bello e più leggero)
// - luci dinamiche: la scena è al buio, AT/esplosioni/proiettili/funghi illuminano
// - particelle additive, onde d'urto, numeri del danno animati
// =====================================================================
const RS = 2;                      // risoluzione degli sprite in cache
const INK = '#120a1e';             // colore del contorno
const FONT = '"Lilita One","Trebuchet MS",system-ui,sans-serif';
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

// Disegna con le funzioni esistenti su un canvas fuori schermo (ctx è temporaneamente reindirizzato).
function paintTo(c2, fn) { const prev = ctx; ctx = c2; try { fn(c2); } finally { ctx = prev; } }

function tintedCopy(src, color) {
  const c = mkCanvas(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}
function outlined(src, px, color = INK) {
  const o = Math.max(1, px * RS), sil = tintedCopy(src, color);
  const c = mkCanvas(src.width, src.height), g = c.getContext('2d');
  for (let a = 0; a < 8; a++) g.drawImage(sil, Math.round(Math.cos(a * Math.PI / 4) * o), Math.round(Math.sin(a * Math.PI / 4) * o));
  g.drawImage(src, 0, 0);
  return c;
}

const SPR = {};
/** Sprite in cache: painter disegna in coordinate locali con l'origine in (ox, oy). */
function sprite(key, w, h, ox, oy, painter, outline = 1.6) {
  if (SPR[key]) return SPR[key];
  let c = mkCanvas(w * RS, h * RS);
  const g = c.getContext('2d');
  g.setTransform(RS, 0, 0, RS, ox * RS, oy * RS);
  g.lineCap = 'round'; g.lineJoin = 'round';
  paintTo(g, () => painter(g));
  if (outline) c = outlined(c, outline);
  const s = { c, w, h, ox, oy, white: null };
  SPR[key] = s;
  return s;
}
function whiteOf(s) { return s.white || (s.white = tintedCopy(s.c, '#ffffff')); }
function drawSpr(s, x, y, sx = 1, sy = 1, rot = 0, flash = 0) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (sx !== 1 || sy !== 1) ctx.scale(sx, sy);
  ctx.drawImage(s.c, -s.ox, -s.oy, s.w, s.h);
  if (flash > 0) { ctx.globalAlpha *= Math.min(1, flash); ctx.drawImage(whiteOf(s), -s.ox, -s.oy, s.w, s.h); }
  ctx.restore();
}

// ---------- sprite di luce / bagliore ----------
const GLOW = {};
function glowSprite(col) {
  if (GLOW[col]) return GLOW[col];
  const c = mkCanvas(128, 128), g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, col); gr.addColorStop(0.25, col.replace(/[\d.]+\)$/, m => (parseFloat(m) * 0.55) + ')'));
  gr.addColorStop(1, col.replace(/[\d.]+\)$/, '0)'));
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return (GLOW[col] = c);
}
function glow(x, y, r, col, a = 1) {
  const s = glowSprite(col); const pa = ctx.globalAlpha; ctx.globalAlpha = pa * a;
  ctx.drawImage(s, x - r, y - r, r * 2, r * 2); ctx.globalAlpha = pa;
}
const SHADOW = (() => {
  const c = mkCanvas(128, 64), g = c.getContext('2d'), gr = g.createRadialGradient(64, 32, 0, 64, 32, 64);
  gr.addColorStop(0, 'rgba(5,2,12,.62)'); gr.addColorStop(.6, 'rgba(5,2,12,.32)'); gr.addColorStop(1, 'rgba(5,2,12,0)');
  g.setTransform(1, 0, 0, 0.5, 0, 0); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return c;
})();
function drawShadow(x, y, rx, ry) { ctx.drawImage(SHADOW, x - rx * 1.25, y + 9 - ry * 1.3, rx * 2.5, ry * 2.6); }

// ---------- utilità ----------
function tileHash(x, y, seed = 0) { const n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453; return n - Math.floor(n); }
function vnoise(x, y, seed) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const s = (v) => v * v * (3 - 2 * v);
  const a = tileHash(xi, yi, seed), b = tileHash(xi + 1, yi, seed), c = tileHash(xi, yi + 1, seed), d = tileHash(xi + 1, yi + 1, seed);
  return a + (b - a) * s(xf) + (c - a) * s(yf) + (a - b - c + d) * s(xf) * s(yf); }
function drawRoundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function rgrad(g, x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
function lgrad(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
function eyes(g, x1, x2, y, r, iris = '#ffd23f', look = 0.6) {
  for (const x of [x1, x2]) {
    g.fillStyle = '#fff'; g.beginPath(); g.ellipse(x, y, r, r * 0.9, 0, 0, 6.28); g.fill();
    g.fillStyle = iris; g.beginPath(); g.arc(x + look, y + 0.3, r * 0.62, 0, 6.28); g.fill();
    g.fillStyle = '#140818'; g.beginPath(); g.arc(x + look * 1.2, y + 0.3, r * 0.34, 0, 6.28); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x + look - r * 0.25, y - r * 0.3, r * 0.2, 0, 6.28); g.fill();
  }
}

function playBuf(id,loop){
  const b=AU.buf[id];if(!b||!AU.ctx||!AU.on)return null;
  const s=AU.ctx.createBufferSource();s.buffer=b;s.loop=!!loop;s.connect(AU.cg);s.start();return s;
}
function sfx(n){
  if(!AU.ctx||!AU.on)return;
  const now=performance.now();
  if(now-(AU.last[n]||0)<(SFXMIN[n]||60))return;
  if(AU.buf[n]){AU.last[n]=now;playBuf(n);return}
  if(now<AU.sup&&['shoot','slash','throw','boom','hair'].includes(n))return;
  AU.last[n]=now;
  try{SFX[n]()}catch(e){}
}
function sfx2(id,fb){
  if(!AU.ctx||!AU.on)return;
  const now=performance.now();
  if(AU.buf[id]){
    if(now-(AU.last[id]||0)<150)return;
    AU.last[id]=now;playBuf(id);
    if(id.startsWith('w_'))AU.sup=now+120;
    return;
  }
  if(MEME[id]){if(now-(AU.last[id]||0)<150)return;AU.last[id]=now;try{MEME[id]()}catch(e){}return}
  if(fb)sfx(fb);
}
function startMusic(){
  const bass=[110,0,110,0,131,0,110,0,98,0,98,0,123,0,147,0];
  const lead=[440,0,523,0,659,0,523,0,392,0,494,0,587,0,494,0];
  setInterval(()=>{
    if(!AU.ctx||!AU.on||document.hidden||AU.buf.music)return;
    const k=AU.i%16,up=(AU.i>>4)%2?1.122:1;
    if(bass[k])tone(bass[k]*up,.2,'triangle',.5,0,0,AU.mg);
    if(lead[k])tone(lead[k]*up,.1,'square',.18,0,0,AU.mg);
    AU.i++;
  },150);
}
addEventListener('pointerdown',auInit);
addEventListener('keydown',auInit);

// Aggancio ai punti del gioco senza toccare il resto del codice
(function(){
  const _hit=hit;
  hit=function(e){const was=e&&e.dead;const r=_hit.apply(this,arguments);
    if(e&&!was&&e.dead)sfx(e.ty==='k'?'bosskill':'kill');else sfx('hit');return r};
  const _lv=levelUp;
  levelUp=function(){sfx('level');return _lv.apply(this,arguments)};
  const _btn=btn;
  btn=function(txt,fn,cls){return _btn(txt,function(){sfx('click');return fn.apply(this,arguments)},cls)};
  const _up=update;
  update=function(dt){
    const hp=P.hp,s=socks,c=cheese,m=melons,x0=xp,bl=B.length,hl=HR.length,xl=X.length,
          sl=SL.length,cl=CT.length,tl=TW.length,bs=E.filter(e=>e.ty==='k').length,
          sl0=tm.sl>.9,ov0=over,fd0=finalDefeated;
    if(AU.ws)for(const k in wp){if(wp[k]===4&&AU.ws[k]===3)sfx2('evo_'+k);else if(wp[k]===5&&AU.ws[k]===4)sfx2('evo2_'+k)}
    const r=_up.apply(this,arguments);
    const dh=hp-P.hp;
    if(dh>6){sfx('big');hurtFlash=.28}else if(dh>.05){sfx('hurt');hurtFlash=Math.max(hurtFlash,.18)}
    if(socks>s||cheese>c||melons>m||xp>x0)sfx('pick');
    if(B.length>bl)sfx('shoot');
    if(HR.length>hl)sfx('hair');
    if(X.length>xl)sfx('boom');
    if(SL.length>sl)sfx('slash');
    if(CT.length>cl||TW.length>tl)sfx('throw');
    for(const e of E)if(e.ty==='k'&&!AU.sb.has(e)){AU.sb.add(e);sfx2('boss_'+String(e.nm||'kg').toLowerCase(),'boss')}
    if(!sl0&&tm.sl>.9)sfx('slap');
    if(!ov0&&over)sfx('death');
    if(!fd0&&finalDefeated)sfx('victory');
    AU.ws=Object.assign({},wp);
    return r;
  };
})();

// ===== SUONI PERSONALIZZATI: carichi i tuoi file, restano salvati sul dispositivo =====
const IDB={
  db:null,
  open(){return new Promise((res,rej)=>{
    if(IDB.db)return res(IDB.db);
    try{const r=indexedDB.open('atm_snd',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('f');
      r.onsuccess=()=>{IDB.db=r.result;res(IDB.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async put(k,v){try{const db=await IDB.open();return await new Promise(r=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}},
  async del(k){try{const db=await IDB.open();return await new Promise(r=>{const t=db.transaction('f','readwrite');t.objectStore('f').delete(k);t.oncomplete=r;t.onerror=r})}catch(e){}},
  async all(){try{const db=await IDB.open();return await new Promise(r=>{const out={};const q=db.transaction('f').objectStore('f').openCursor();q.onsuccess=e=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue()}else r(out)};q.onerror=()=>r(out)})}catch(e){return {}}}
};
const SLOTS=[
  ['music','🎵 Musica di sottofondo (loop)'],['click','Click dei pulsanti'],['hit','Colpo al nemico'],['kill','Nemico ucciso'],
  ['pick','Raccolta oggetti'],['hurt','AT subisce danno'],['big','AT subisce un colpo forte'],['level','Level up'],
  ['boss','Boss compare (generico)'],['bosskill','Boss sconfitto'],['slap','Schiaffo di Piergiorgio'],['death','Morte'],['victory','Vittoria'],
  ['shoot','Sparo / lancio'],['slash','Graffio'],['boom','Esplosione'],['throw','Lancio CT / TR'],['hair','Raffica di peli'],
  ['boss_kg','Boss KG compare'],['boss_oru','Boss ORU compare'],['boss_pom','Boss Pomodoro dorato compare'],
  ['boss_toji','Boss Toji compare'],['boss_xav','Boss Xavlegbagaskanius compare']
];
for(const k of ['knife','kick','web','drone','dand','tr'])SLOTS.push(['w_'+k,'Attacco: '+NAMES[k]]);
for(const k in EVN)SLOTS.push(['evo_'+k,'⭐ Evoluzione: '+EVN[k]]);
for(const k in EVN2)SLOTS.push(['evo2_'+k,'⭐⭐ Seconda evoluzione: '+EVN2[k]]);
const normS=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
function matchSlot(fname){
  const base=normS(fname.replace(/\.[^.]+$/,''));
  for(const [id,label] of SLOTS){
    const short=label.replace(/^.*?: /,'');
    if(normS(id)===base||normS(label)===base||normS(short)===base)return id;
  }
  return null;
}
async function decodeSet(id,file){
  const ab=await file.arrayBuffer();
  AU.buf[id]=await AU.ctx.decodeAudioData(ab);AU.names[id]=file.name||id;
}
async function loadCustom(){
  try{const all=await IDB.all();for(const id in all){try{await decodeSet(id,all[id])}catch(e){}}startCustomMusic()}catch(e){}
}
async function setCustom(id,file){
  try{await decodeSet(id,file)}catch(e){AU.msg='File non leggibile: '+file.name;return}
  await IDB.put(id,file);if(id==='music')startCustomMusic();
}
async function delCustom(id){delete AU.buf[id];delete AU.names[id];await IDB.del(id);if(id==='music')startCustomMusic()}
function startCustomMusic(){
  if(AU.msrc){try{AU.msrc.stop()}catch(e){}AU.msrc=null}
  if(AU.buf.music&&AU.on)AU.msrc=playBuf('music',true);
}
function soundsUI(){
  auInit();
  ov.innerHTML='<h2>🎵 Suoni personalizzati</h2><p style="font-size:13px;opacity:.85;max-width:420px">Scegli tutti i file insieme: il nome del file deve essere l’ID dello slot (es. <b>evo_cheese.mp3</b>) oppure il nome mostrato (es. <b>Fetore immondo.mp3</b>). I file restano salvati su questo dispositivo.</p>'+(AU.msg?'<p style="color:#ffd23f;font-size:13px;max-width:420px">'+AU.msg+'</p>':'');
  AU.msg='';
  const sm=(t,fn)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='background:#2e2442;color:#fff;border:1px solid #ffd23f;border-radius:8px;padding:4px 8px;font-size:14px';b.onclick=fn;return b};
  const bulk=document.createElement('input');bulk.type='file';bulk.multiple=true;bulk.accept='audio/*';
  bulk.onchange=async()=>{
    const un=[];let ok=0;
    for(const f of bulk.files){const id=matchSlot(f.name);if(id){await setCustom(id,f);ok++}else un.push(f.name)}
    AU.msg=ok+' file caricati'+(un.length?'. Non riconosciuti (rinominali): '+un.join(', '):'')+(AU.msg?' '+AU.msg:'');
    soundsUI();
  };
  btn('📂 Carica tutti i file insieme',()=>bulk.click());
  const box=document.createElement('div');
  box.style.cssText='width:min(440px,94%);max-height:48vh;overflow-y:auto;text-align:left;background:#0005;border-radius:10px;padding:6px 8px;margin:8px 0';
  for(const [id,label] of SLOTS){
    const row=document.createElement('div');
    row.style.cssText='display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid #ffffff18;font-size:13px';
    const nm=document.createElement('div');nm.style.flex='1';
    nm.innerHTML=label+'<br><small style="opacity:.6">'+id+(AU.buf[id]?' · ✅ '+AU.names[id]:' · —')+'</small>';
    row.appendChild(nm);
    if(AU.buf[id])row.appendChild(sm('▶',()=>{if(id==='music')startCustomMusic();else playBuf(id)}));
    const one=document.createElement('input');one.type='file';one.accept='audio/*';one.style.display='none';
    one.onchange=async()=>{if(one.files[0]){await setCustom(id,one.files[0]);soundsUI()}};
    row.appendChild(one);
    row.appendChild(sm('📁',()=>one.click()));
    if(AU.buf[id])row.appendChild(sm('🗑',async()=>{await delCustom(id);soundsUI()}));
    box.appendChild(row);
  }
  ov.appendChild(box);btn('⬅ Indietro',menu);ov.style.display='flex';
}
(function(){
  const _menu=menu;
  menu=function(){_menu.apply(this,arguments)};
  const _rdy=rdy;
  rdy=function(k,dt,c){
    const r=_rdy.apply(this,arguments);
    if(r){const m={kn:'knife',cp:'knife',ki:'kick',we:'web',dr:'drone',fo:'dand',tw:'tr'}[k];if(m)sfx2('w_'+m)}
    return r;
  };
})();


// ===== SUONI STILE MEME (sintetizzati, originali) =====
const MM={
  vboom:()=>{tone(70,.9,'sine',.9,-45);tone(140,.5,'sine',.5,-90);noise(.35,.4,900,60)},
  horn:()=>{for(let i=0;i<3;i++)[466,622,932].forEach(f=>{tone(f,.22,'sawtooth',.09,0,i*.27);tone(f*1.01,.22,'square',.05,0,i*.27)})},
  trom:()=>{[[233,0],[220,.32],[208,.64]].forEach(([f,w])=>tone(f,.28,'sawtooth',.2,-8,w));tone(196,1,'sawtooth',.22,-50,.96)},
  scratch:()=>{noise(.12,.4,6000,300);setTimeout(()=>noise(.15,.4,300,6000),110)},
  bonk:()=>{tone(320,.12,'sine',.45,-220);noise(.05,.15,3000,500)},
  boing:()=>{tone(180,.5,'sine',.35,500);tone(180,.5,'triangle',.15,520,.02)},
  fart:()=>{tone(85,.55,'sawtooth',.35,-45);noise(.55,.28,400,70)},
  bruh:()=>tone(200,.5,'triangle',.5,-100),
  tada:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.14,0,i*.08)),
  rim:()=>{tone(220,.08,'square',.25,-80);tone(220,.08,'square',.25,-80,.16);noise(.5,.3,8000,2000)},
  honk:()=>{tone(340,.25,'sawtooth',.3,-60);tone(342,.25,'square',.15,-60)},
  whistle:()=>tone(300,.55,'sine',.28,1400),
  pew:()=>tone(1400,.18,'square',.12,-1200),
  dun:()=>[0,.45,.9].forEach((w,i)=>tone(i<2?139:104,.4,'sawtooth',.3,-10,w)),
  expl:()=>{noise(.5,.5,1800,50);tone(90,.4,'sine',.4,-60)},
  roar:()=>{tone(90,.8,'sawtooth',.35,-30);noise(.8,.3,1500,100)}
};
Object.assign(SFX,{
  kill:()=>tone(600,.06,'sine',.12,400),
  pick:()=>{tone(988,.07,'square',.07);tone(1319,.22,'square',.07,0,.07)},
  hurt:MM.bonk, big:MM.vboom, level:MM.tada,
  boss:()=>{MM.dun();setTimeout(MM.horn,500)},
  bosskill:()=>{MM.horn();setTimeout(MM.tada,500)},
  slap:()=>{MM.scratch();setTimeout(MM.bonk,250)},
  death:MM.trom,
  victory:()=>{MM.horn();setTimeout(MM.tada,900)},
  click:()=>tone(600,.05,'sine',.12,300)
});
const MEME={};
const EVM={sock:'horn',cheese:'fart',nails:'scratch',knife:'dun',ct:'boing',kick:'bonk',dand:'tada',web:'whistle',drone:'pew',melon:'honk',hair:'rim',tr:'expl',lion:'roar',fart:'fart'};
for(const k in EVM){
  MEME['evo_'+k]=MM[EVM[k]];
  MEME['evo2_'+k]=()=>{MM[EVM[k]]();setTimeout(MM.vboom,350);setTimeout(MM.horn,600)};
}
MEME.boss_kg=()=>{MM.bruh();setTimeout(MM.horn,500)};
MEME.boss_oru=()=>{MM.dun();setTimeout(MM.vboom,600)};
MEME.boss_pom=()=>{MM.honk();setTimeout(MM.honk,300);setTimeout(MM.vboom,700)};
MEME.boss_toji=()=>{MM.dun();setTimeout(MM.scratch,700)};
MEME.boss_xav=()=>{MM.horn();setTimeout(MM.vboom,800);setTimeout(MM.dun,1100)};

(function(){
  const pbEl=document.getElementById('pb');if(!pbEl)return;
  const mb=document.createElement('button');

  mb.style.cssText=getComputedStyle(pbEl).cssText||'';

menu();
let last=performance.now();
(function loop(n){
  const dt=Math.min(.05,(n-last)/1000);last=n;
  if(!paused&&!over)update(dt);
  draw();
  requestAnimationFrame(loop);
})(last);
